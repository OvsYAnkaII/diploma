name: Sync to Overleaf (manual)
on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Sync to Overleaf
        env:
          TOKEN: ${{ secrets.OVERLEAF_GIT_TOKEN }}
          PROJECT_ID: ${{ secrets.OVERLEAF_PROJECT_ID }}
        run: |
          git clone --depth 1 https://git:$TOKEN@git.overleaf.com/$PROJECT_ID temp-overleaf
          rsync -av --delete ./ temp-overleaf/ \
            --exclude .git \
            --exclude .github \
            --exclude CmakeLists.txt \
            --exclude main.cpp \
            --exclude graph.h \
            --exclude graph.cpp \
            --exclude coloring_algorithms.h \
            --exclude coloring_algorithms.cpp
          cd temp-overleaf
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Sync from GitHub Actions" || echo "No changes"
          git push https://git:$TOKEN@git.overleaf.com/$PROJECT_ID main
